<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>문의함 — 플레이스 체험단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1F1A17;
  --muted: #6E6560;
  --paper: #FFFFFF;
  --butter: #F7EAEE;
  --marigold: #7A1F3D;
  --leaf: #7A1F3D;
  --line: #E4E0DC;
  --alert: #B3261E;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: #F4F3F1;
  color: var(--ink);
  font-family: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
}
:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }
.wrap { width: min(100% - 32px, 720px); margin-inline: auto; padding: 24px 0 48px; }
h1 { font-size: 22px; margin: 0 0 16px; }
.login { display: grid; gap: 12px; max-width: 360px; margin-top: 12vh; }
input[type="password"] {
  font: inherit; font-size: 17px;
  padding: 14px 16px; min-height: 52px;
  border: 2px solid var(--line); border-radius: 10px; background: var(--paper);
}
button {
  font: inherit; font-size: 16px;
  min-height: 48px; padding: 10px 16px;
  border: 2px solid var(--line); border-radius: 10px;
  background: var(--paper); color: var(--ink); cursor: pointer;
}
button.primary { background: var(--marigold); border-color: var(--marigold); color: #fff; font-weight: 700; }
.err { color: var(--alert); }
.count { background: var(--butter); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
.count b { font-size: 40px; line-height: 1; display: block; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.cards { display: grid; gap: 12px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card .date { color: var(--muted); font-size: 14px; }
.card .who { font-size: 18px; font-weight: 700; margin-top: 2px; }
.card .store { margin-top: 4px; overflow-wrap: anywhere; }
.card .store a { color: var(--leaf); }
.copy { margin-top: 8px; min-height: 44px; }
.status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.status button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: #fff; font-weight: 700; }
.empty { color: var(--muted); padding: 24px 0; }
.src { margin-top: 8px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.src b { color: var(--ink); font-weight: 700; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.panel h2 { font-size: 17px; margin: 0 0 10px; }
.tally { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tally li { display: flex; justify-content: space-between; gap: 12px; }
.maker { display: grid; gap: 10px; }
.maker label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.maker input {
  font: inherit; font-size: 16px; padding: 10px 12px; min-height: 46px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink);
}
.maker output { display: block; padding: 10px 12px; background: var(--butter); border-radius: 10px; overflow-wrap: anywhere; font-size: 14px; }
details summary { cursor: pointer; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">

  <form class="login" id="login">
    <h1>문의함</h1>
    <label for="pw">관리자 비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="primary" type="submit">열기</button>
    <p class="err" id="login-err" role="alert" hidden></p>
  </form>

  <div id="board" hidden>
    <div class="count"><b id="new-count">0</b>새 문의</div>
    <div class="bar">
      <h1 style="margin:0">체험단 문의</h1>
      <span>
        <button type="button" id="reload">새로고침</button>
        <button type="button" id="logout">잠그기</button>
      </span>
    </div>
    <p class="err" id="board-err" role="alert" hidden></p>

    <div class="panel">
      <h2>어디서 문의가 왔나요</h2>
      <ul class="tally" id="tally"></ul>
    </div>

    <details class="panel">
      <summary>추적 링크 만들기</summary>
      <form class="maker" id="maker" style="margin-top:12px">
        <label>어디에 보낼 링크인가요 (utm_source)
          <input name="utm_source" placeholder="예: visit, kakao, instagram" required>
        </label>
        <label>어떤 방식인가요 (utm_medium)
          <input name="utm_medium" placeholder="예: direct, message, qr">
        </label>
        <label>캠페인 이름 (utm_campaign)
          <input name="utm_campaign" placeholder="예: 2026-10-mapo">
        </label>
        <label>가게나 메모 (utm_content)
          <input name="utm_content" placeholder="예: 새싹공방">
        </label>
        <output id="maker-out">받는 곳을 적으면 링크가 만들어져요.</output>
        <button type="button" id="maker-copy">링크 복사</button>
      </form>
    </details>

    <div class="cards" id="cards"></div>
  </div>

</div>
<script>
(function () {
  var STATUSES = ['새 문의', '연락함', '완료'];
  var KEY = 'admin-pw';
  var $ = function (id) { return document.getElementById(id); };

  function getPw() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setPw(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {} }

  async function api(method, body) {
    var r = await fetch('/api/admin', {
      method: method,
      headers: { 'Content-Type': 'application/json', 'x-admin-password': getPw() },
      body: body ? JSON.stringify(body) : undefined
    });
    var j = await r.json().catch(function () { return {}; });
    if (r.status === 401) { var e = new Error(j.error || '비밀번호가 맞지 않아요.'); e.auth = true; throw e; }
    if (!r.ok) throw new Error(j.error || '불러오지 못했어요.');
    return j;
  }

  function showLogin(errText) {
    setPw('');
    $('board').hidden = true;
    $('login').hidden = false;
    $('login-err').textContent = errText || '';
    $('login-err').hidden = !errText;
    $('pw').value = '';
    $('pw').focus();
  }

  function fmt(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '. ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderTally(rows) {
    var counts = {};
    rows.forEach(function (r) {
      var k = r.utm_source || '(링크 없음)';
      counts[k] = (counts[k] || 0) + 1;
    });
    var box = $('tally');
    box.textContent = '';
    var keys = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    if (!keys.length) { box.appendChild(el('li', null, '아직 문의가 없어요.')); return; }
    keys.forEach(function (k) {
      var li = el('li');
      li.appendChild(el('span', null, k));
      li.appendChild(el('b', null, counts[k] + '건'));
      box.appendChild(li);
    });
  }

  function render(rows) {
    renderTally(rows);
    $('new-count').textContent = rows.filter(function (r) { return r.status === '새 문의'; }).length;
    var box = $('cards');
    box.textContent = '';
    if (!rows.length) { box.appendChild(el('p', 'empty', '아직 들어온 문의가 없어요.')); return; }
    rows.forEach(function (row) {
      var c = el('article', 'card');
      c.appendChild(el('div', 'date', fmt(row.created_at)));
      c.appendChild(el('div', 'who', row.name));

      var store = el('div', 'store');
      if (/^https?:\/\//i.test(row.store)) {
        var a = el('a', null, row.store);
        a.href = row.store; a.target = '_blank'; a.rel = 'noopener noreferrer';
        store.appendChild(a);
      } else {
        store.textContent = row.store;
      }
      c.appendChild(store);

      var src = el('div', 'src');
      if (row.utm_source) {
        src.appendChild(el('b', null, row.utm_source));
        var rest = [row.utm_medium, row.utm_campaign, row.utm_content].filter(Boolean).join(' / ');
        if (rest) src.appendChild(document.createTextNode(' · ' + rest));
      } else {
        src.textContent = row.referrer ? '링크 없이 들어옴 · ' + row.referrer : '링크 없이 직접 들어옴';
      }
      c.appendChild(src);

      var copy = el('button', 'copy', row.contact + ' 복사');
      copy.type = 'button';
      copy.addEventListener('click', function () {
        navigator.clipboard.writeText(row.contact).then(function () {
          copy.textContent = '복사했어요';
          setTimeout(function () { copy.textContent = row.contact + ' 복사'; }, 1500);
        }, function () {
          var s = window.getSelection(), r = document.createRange();
          r.selectNodeContents(copy); s.removeAllRanges(); s.addRange(r);
        });
      });
      c.appendChild(copy);

      var st = el('div', 'status');
      STATUSES.forEach(function (name) {
        var b = el('button', null, name);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(row.status === name));
        b.addEventListener('click', async function () {
          if (row.status === name) return;
          try { await api('PATCH', { id: row.id, status: name }); await load(); }
          catch (e) { e.auth ? showLogin(e.message) : showErr(e.message); }
        });
        st.appendChild(b);
      });
      c.appendChild(st);
      box.appendChild(c);
    });
  }

  function showErr(t) { $('board-err').textContent = t; $('board-err').hidden = !t; }

  async function load() {
    showErr('');
    var j = await api('GET');
    $('login').hidden = true;
    $('board').hidden = false;
    render(j.rows || []);
  }

  $('login').addEventListener('submit', async function (e) {
    e.preventDefault();
    setPw($('pw').value);
    try { await load(); }
    catch (err) { err.auth ? showLogin('비밀번호가 맞지 않아요.') : showLogin(err.message); }
  });
  $('reload').addEventListener('click', function () {
    load().catch(function (e) { e.auth ? showLogin(e.message) : showErr(e.message); });
  });
  $('logout').addEventListener('click', function () { showLogin(''); });

  // 추적 링크 만들기
  function makeLink() {
    var f = $('maker').elements;
    var p = new URLSearchParams();
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (k) {
      var v = f[k].value.trim().replace(/\s+/g, '-');
      if (v) p.set(k, v);
    });
    if (!p.get('utm_source')) return '';
    return location.origin + '/?' + p.toString();
  }
  $('maker').addEventListener('input', function () {
    $('maker-out').textContent = makeLink() || '받는 곳을 적으면 링크가 만들어져요.';
  });
  $('maker-copy').addEventListener('click', function () {
    var link = makeLink();
    if (!link) { $('maker-out').textContent = '받는 곳(utm_source)을 먼저 적어 주세요.'; return; }
    var b = $('maker-copy');
    navigator.clipboard.writeText(link).then(function () {
      b.textContent = '복사했어요';
      setTimeout(function () { b.textContent = '링크 복사'; }, 1500);
    }, function () {
      var s = window.getSelection(), r = document.createRange();
      r.selectNodeContents($('maker-out')); s.removeAllRanges(); s.addRange(r);
    });
  });

  if (getPw()) load().catch(function (e) { showLogin(e.auth ? e.message : ''); });
  else $('pw').focus();
})();
</script>
</body>
</html>
